<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jira — план по сотрудникам</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='board.css') }}" />
</head>
<body>
  <header class="toolbar">
    <h1>План задач</h1>
    <label class="sprint-filter-label" for="sprint-filter">Спринт:</label>
    <select id="sprint-filter">
      <option value="">Все спринты</option>
    </select>
    <label class="sprint-filter-label" for="customer-filter">Бизнес-партнёр:</label>
    <select id="customer-filter">
      <option value="">Все бизнес-партнёры</option>
    </select>
    <label class="sprint-filter-label" for="label-filter">Метки:</label>
    <select id="label-filter">
      <option value="">Все метки</option>
    </select>
    <label class="sprint-filter-label" for="range-from">Даты:</label>
    <input type="date" id="range-from" class="range-input" aria-label="Показывать календарные дни начиная с даты" />
    <span class="range-dash">—</span>
    <input type="date" id="range-to" class="range-input" aria-label="Показывать календарные дни по дату включительно" />
    <button type="button" id="btn-range-reset" class="icon-btn" title="Весь горизонт планирования" aria-label="Сбросить фильтр по датам">↺</button>
    <input type="search" id="search-input" placeholder="Поиск по номеру или заголовку…" aria-label="Поиск по номеру или заголовку задачи" />
    <button type="button" id="btn-refresh">Обновить из Jira</button>
    <button type="button" id="btn-undo" class="icon-btn" disabled title="Отменить последнее действие" aria-label="Отменить последнее действие">↩</button>
    <button type="button" id="btn-clear" class="icon-btn" disabled title="Отменить все несохранённые изменения" aria-label="Отменить все несохранённые изменения">✕</button>
    <button type="button" id="btn-save" disabled>Сохранить в Jira</button>
    <span id="status" class="status"></span>
  </header>
  <div class="board-wrap">
    <div id="board" class="board" aria-busy="true"></div>
  </div>
  <script src="{{ url_for('static', filename='board.js') }}"></script>
</body>
</html>
