# JQL для выборки задач (рекомендуется требовать исполнителя — без assignee задачи не показываются).
jql: 'assignee is not EMPTY AND statusCategory != Done ORDER BY priority DESC'

# Приоритеты: порядок в очереди сотрудника (выше в списке = выше приоритет) и цвета блоков.
priorities:
  order:
    - Highest
    - High
    - Medium
    - Low
    - Lowest
  colors:
    Highest: "#b85c5c"
    High: "#c68452"
    Medium: "#c2a24f"
    Low: "#6f9a76"
    Lowest: "#73879a"
    default: "#7f8f9b"

# Горизонт планирования на шкале дат.
# kind: calendar_days — ровно count календарных дней от сегодня (на шкале только рабочие дни внутри интервала).
# kind: working_days — count рабочих дней подряд от сегодня (выходные не занимают места на шкале).
planning_horizon:
  kind: calendar_days
  count: 90

pixels_per_working_day: 36

# Откуда брать плановые трудозатраты (ширина прямоугольника и значение в подсказке, в рабочих днях).
# type:
#   timetracking_original — fields.timetracking.originalEstimateSeconds -> дни через working_hours_per_day
#   timetracking_remaining — remainingEstimateSeconds
#   number_field — значение поля как число рабочих дней (например story points как «дни»)
#   seconds_field — значение поля как секунды -> дни через working_hours_per_day
effort:
  type: timetracking_original
  jira_field_id: null

# Если оценка отсутствует — минимальная длина в человеко-днях (md).
min_effort_working_days: 1
working_hours_per_day: 8

# Поля для 3-й строки блока, всплывающей подсказки и фильтра по спринту.
fields:
  # Заказчик — 3-я строка в прямоугольнике. Укажите ID кастомного поля Jira.
  customer:
    jira_field_id: customfield_10100  # колонка в jira_mock/issues.csv

  # Спринт — используется для выпадающего фильтра в шапке страницы.
  sprint:
    jira_field_id: customfield_10007  # колонка в jira_mock/issues.csv

  # Метки — выпадающий фильтр по меткам в шапке страницы. Обычно это системное
  # поле Jira `labels` (список строк), но можно указать и кастомное поле.
  # null — фильтр по меткам не показывается.
  labels:
    jira_field_id: labels  # например labels / customfield_...

  # Дата начала. Если у задачи в Jira заполнены ОБЕ даты (start_date и
  # end_date) и трудозатраты — задача занимает на диаграмме строго свой
  # диапазон дат (ширина = реальное число рабочих дней между ними, не
  # трудозатраты) вместо очереди в строке сотрудника. Не хватает хотя бы
  # одного из трёх значений — задача уходит в конец очереди и заполняет
  # свободные дни по трудозатратам, как раньше.
  # Любое перетаскивание/растягивание прямоугольника записывает в
  # pending_changes.json сразу три параметра — дату начала, дату окончания и
  # продолжительность. В Jira дата уходит, если jira_field_id задан; если
  # null — дата остаётся только на диаграмме и при сохранении пропускается.
  start_date:
    jira_field_id: customfield_10015  # например duedate / customfield_...

  # Дата завершения — по тем же правилам, что и start_date.
  end_date:
    jira_field_id: duedate

# ─────────────────────────────────────────────────────────────────────────────
# Переопределения полей по типам задач.
#
# В разных типах задач Jira держит даты и трудозатраты в разных полях. Здесь
# можно указать, какие поля использовать для конкретного типа: они читаются на
# доске и в них же сохраняются изменения. Всё, что не указано, берётся из
# корневых секций effort/fields выше.
#
# Ключ — название типа задачи ровно как в Jira («Задача», «Epic», «Дефект»);
# регистр и пробелы по краям не важны. Вместо названия можно указать id типа
# (например 10001) — удобно, если названия локализованы по-разному.
#
# Ниже — два примера; раскомментируйте и поправьте под свои поля.
issue_types: {}
